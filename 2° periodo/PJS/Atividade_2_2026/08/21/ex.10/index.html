<html>
<head>
    <title>Exercício 10</title>

    <script type="text/javascript">

        numero = parseInt(prompt("Digite um número inteiro maior ou igual a 2:"));

        document.write("<table border='1'>");

        document.write("<tr>");
        document.write("<th>Base decimal</th>");
        document.write("<th>Base binária</th>");
        document.write("<th>Base hexadecimal</th>");
        document.write("</tr>");

        for (i = 0; i <= numero; i++) {

            document.write("<tr>");

            document.write("<td>" + i + "</td>");

            document.write("<td>" + i.toString(2) + "</td>");

            document.write("<td>" + i.toString(16).toUpperCase() + "</td>");

            document.write("</tr>");
        }

        document.write("</table>");

    </script>
</head>

<body>
</body>
</html>
