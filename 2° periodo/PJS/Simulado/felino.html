<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Felinos</title>
    <style>
        * {
            box-sizing: border-box;
            color: green;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            padding-top: 80px;
            font-family: sans-serif;
        }

        .gato-card {
            width: 170px;
            text-align: center;
        }

        .gato-card img {
            width: 100px;
            height: auto;
            cursor: pointer;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        input {
            width: 85%;
            border: none;
            border-bottom: 2px solid green;
            outline: none;
            text-align: center;
            color: green;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="gato-card">
        <img src="img/gato01.gif" id="gato1" alt="Gato 1">
        <p>Clique em mim!</p>
    </div>

    <div class="gato-card">
        <img src="img/gato02.gif" id="gato2" alt="Gato 2">
        <p>Clique sobre mim várias vezes!</p>
        <p id="txtCarinhos">Carinhos: 0</p>
    </div>

    <div class="gato-card">
        <img src="img/gato03.gif" id="gato3" alt="Gato 3">
        <p>Passe o cursor do mouse sobre mim!</p>
    </div>

    <div class="gato-card">
        <img src="img/gato04.gif" id="gato4" alt="Gato 4">
        <p id="txtGato4">lá lá lá lá lá</p>
    </div>

    <div class="gato-card">
        <img src="img/gato05.gif" id="gato5" alt="Gato 5"><br><br>
        <button type="button" id="bntSorte">Gerar número da sorte</button>
        <input type="text" id="txtSorte" readonly>
    </div>

    <script>
        let primeiroNome = localStorage.getItem("primeiroNome") || "Usuário";
        let contadorCarinhos = 0;

        document.getElementById("gato1").addEventListener("click", function(){
            alert("Oi " + primeiroNome + ", tudo bem com você?");
        });

        document.getElementById("gato2").addEventListener("click", function(){
            contadorCarinhos++;
            document.getElementById("txtCarinhos").textContent = "Carinhos: " + contadorCarinhos;
        });

        document.getElementById("gato3").addEventListener("mouseover", function(){
            this.src = "img/gato06.gif";
        });
        document.getElementById("gato3").addEventListener("mouseout", function(){
            this.src = "img/gato03.gif";
        });

        document.getElementById("gato4").addEventListener("mousemove", function(){
            document.getElementById("txtGato4").textContent = "Ai, pare de fazer cócegas!";
        });
        document.getElementById("gato4").addEventListener("mouseout", function(){
            document.getElementById("txtGato4").textContent = "lá lá lá lá lá";
        });

        document.getElementById("bntSorte").addEventListener("click", function(){
            let numeroSorte = Math.floor(Math.random() * 100) + 1;
            document.getElementById("txtSorte").value = numeroSorte;
        });
    </script>
</body>
</html>
