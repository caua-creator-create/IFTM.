<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 4</title>
<style>
</style>
</head>
<body>
<p id="msg"></p>
</body>
<script>
let x = parseInt(prompt("Informe os segundos:"), 10);
if (!isNaN(x) && x >= 0) {
  const el = document.getElementById('msg');
  function relogio() {
    el.textContent = `Por favor, aguarde ${x} segundos para carregar a página do Google`;
    if (x === 0) {
      window.location.href = "https://www.google.com";
    } else {
      x--;
      setTimeout(relogio, 1000);
    }
  }
  relogio();
}
</script>
</html>
