    <script type="text/javascript">

        var texto = prompt("Digite um texto:");

        var palavras = texto.trim().split(/\s+/);

        var primeira = palavras[0];
        var ultima = palavras[palavras.length - 1];

        document.write(primeira + " " + ultima);

    </script>
