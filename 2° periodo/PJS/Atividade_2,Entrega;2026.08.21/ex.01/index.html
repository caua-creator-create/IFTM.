<html>
<head>
    <title>Exercício 1</title>

    <script type="text/javascript">

        nome = prompt("Digite seu primeiro nome:");
        sobrenome = prompt("Digite seu sobrenome:");
        quantidade = parseInt(prompt("Quantas vezes deseja exibir o nome?"));
        cor = prompt("Digite a cor desejada:");

        nomeCompleto = nome + " " + sobrenome;

        for (i = 1; i <= quantidade; i++) {

            if (i % 2 == 0) {
                document.write("<p style='color:" + cor + "'>" 
                    + i + " - " + nomeCompleto + "</p>");
            } else {
                document.write("<p style='color:black'>" 
                    + i + " - " + nomeCompleto + "</p>");
            }
        }

    </script>
</head>

<body>
</body>
</html>
