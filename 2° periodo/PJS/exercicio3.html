<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 3</title>
<style>
</style>
</head>
<body>
<div id="nome"></div>
</body>
<script>
const val = prompt("Digite seu nome completo:");
if (val) {
  const el = document.getElementById('nome');
  el.textContent = val;
  let px = 14;
  const loop = setInterval(() => {
    if (px >= 40) {
      clearInterval(loop);
    } else {
      px += 2;
      el.style.fontSize = px + 'px';
    }
  }, 500);
}
</script>
</html>
