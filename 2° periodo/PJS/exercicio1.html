<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Exercício 1</title>
<style>
</style>
</head>
<body>
<form>
<input type="text" id="c1" placeholder="Caixa 1">
<input type="text" id="c2" placeholder="Caixa 2">
<button type="button" onclick="transferir()">Mover</button>
</form>
</body>
<script>
function transferir() {
  setTimeout(() => {
    const orig = document.getElementById('c1');
    const dest = document.getElementById('c2');
    dest.value = orig.value;
    orig.value = '';
  }, 2000);
}
</script>
</html>
