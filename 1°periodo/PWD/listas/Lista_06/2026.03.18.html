<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026.03.18</title>
</head>
<body>
    <form>
        <div>
            <label for="Nome">Nome :</label>
            <input type="text" id="Nome" name="usuario_nome">
        </div>
        <div>
            <label for="idade"> Idade :</label>
            <input type="number" min="0" id="idade" name="idade">
        </div>
        <div>
            <label for="date">Data de nascimento:</label>
            <input type="date" id="date" name="date">
        </div>
        <div>
            <label for="E-mail">E-mail:</label>
            <input type="email" id="E-mail" name="email">
        </div>
        <div>
            <p>Genêro de nascença:</p>
            <input type="radio" id="genero-m" name="genero" value="m">
            <label for="genero-m">Masculino</label>
            <input type="radio" id="genero-f" name="genero" value="f">
            <label for="genero-f">Feminino</label>
        </div>
        <div>
            <label for="telefone">Telefone :</label>
            <input type="tel" id="telefone" name="telefone">
        </div>
        <div>
            <label for="link">Página pessoal:</label>
            <input type="url" id="link" name="link">
        </div>
        <div>
            <label for="cidade">Cidade :</label>
            <input type="text" id="cidade" name="cidade">
            <label for="num">,</label>
            <input type="number" min="1" id="num" name="num">
        </div>
        <div>
            <label for ="estado">Estado civil (atualmente):</label>
            <select name="estado-civil" id="estado">
                <option name="">Selecione</option>
                <option name="solteiro">Solteiro</option>
                <option name="casado">Casado</option>
                <option name="divorciado">Divorciado</option>
                <option name="viuvo">Viúvo</option>
                <option name="outro">Outro</option>
            </select>
        </div>


            <button type="submit">Entrar</button>
    </form>
</body>
</html>
