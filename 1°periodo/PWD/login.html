<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Meu Site</div>
            <ul>
                <li><a href="home.html">Início</a></li>
                <li><a href="musicas.html">Músicas</a></li>
                <li><a href="filmes.html">Filmes</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container-login">
        <div class="card-login">
            <h1>Criar Conta / Entrar</h1>
            <form>
                <div class="grupo">
                    <label>Nome</label>
                    <input type="text" placeholder="Seu nome" required>
                </div>
                <div class="grupo">
                    <label>Sobrenome</label>
                    <input type="text" placeholder="Seu sobrenome" required>
                </div>
                <div class="grupo">
                    <label>Email</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="grupo">
                    <label>Telefone</label>
                    <input type="tel" placeholder="(00) 00000-0000" required>
                </div>
                <div class="grupo">
                    <label>Senha</label>
                    <input type="password" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="botao-login">Entrar / Cadastrar</button>
            </form>
        </div>
    </div>

    <footer>
        <p>2026 Meu Site - Todos os direitos reservados</p>
    </footer>
</body>
</html>
